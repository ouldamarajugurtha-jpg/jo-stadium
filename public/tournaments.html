<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b10"><title>Tournois — JO STADIUM</title><style>
:root{--bg:#070a0f;--panel:#10151d;--line:#29323e;--text:#f7f9fc;--muted:#98a3b3;--red:#ff3b30;--green:#2dd58a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}a{color:inherit;text-decoration:none}.top{position:sticky;top:0;background:#080b10f2;border-bottom:1px solid #ffffff14;padding:16px max(18px,5vw);display:flex;justify-content:space-between;align-items:center;gap:14px;z-index:2}.brand{font-size:23px;font-weight:950;letter-spacing:-1px}.brand span{color:var(--red)}.btn{border:1px solid var(--line);border-radius:10px;background:#151c26;color:var(--text);padding:11px 15px;font-weight:800;cursor:pointer;display:inline-flex;justify-content:center;align-items:center}.primary{background:var(--red);border-color:var(--red)}.shell{width:min(1000px,calc(100% - 28px));margin:auto}.intro{padding:35px 0 20px}.eyebrow{color:#ff655d;font-size:11px;letter-spacing:2px;font-weight:900}.intro h1{font-size:clamp(32px,6vw,48px);line-height:1.05;margin:8px 0}.intro p{color:var(--muted)}.notice{display:none;padding:13px;border:1px solid #6a393b;background:#251719;border-radius:12px;margin:15px 0}.notice.show{display:block}.list{display:grid;gap:15px;padding-bottom:60px}.card{background:linear-gradient(145deg,#141b25,#0d1219);border:1px solid var(--line);border-radius:17px;padding:20px}.card h2{margin:0 0 6px;font-size:23px}.muted{color:var(--muted)}.badges{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.badge{border:1px solid #35404f;background:#0a0f16;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.open{color:#78e8b6;border-color:#235c46}.closed{color:#ff9994;border-color:#6a3538}.progress{height:8px;background:#252d39;border-radius:999px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:var(--red)}.form{display:none;border-top:1px solid var(--line);margin-top:16px;padding-top:16px}.form.opened{display:block}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:800;color:#dfe5ed}.field input{width:100%;min-height:45px;border:1px solid #35404f;border-radius:10px;background:#080d13;color:#fff;padding:10px 12px;font:inherit}.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:13px}.ticket{display:none;margin-top:15px;padding:15px;border:1px dashed #2d8b64;background:#10241d;border-radius:12px}.ticket.show{display:block}.ticket strong{font-size:24px;letter-spacing:1px;color:#8af0bc}.empty{padding:28px;text-align:center;border:1px dashed #35404f;border-radius:15px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:22px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:650px){.fields{grid-template-columns:1fr}.top{padding:13px 15px}.brand{font-size:20px}.card{padding:15px}.intro{padding-top:25px}}
@media print{body{background:#fff!important;color:#111!important;font-family:Arial,sans-serif!important}.top,.intro,#notice,#list>article.card:not(.print-target),footer,.form-actions,.muted-screen{display:none!important}.shell{width:100%;margin:0}.list{display:block;padding:0}.card.print-target{display:block!important;border:0!important;background:#fff!important;padding:0!important;margin:0!important}.form.print-ticket{display:block!important;border:0!important;margin:0!important;padding:0!important}.ticket{display:block!important;visibility:visible!important;background:#fff!important;color:#111!important;border:2px solid #222!important;border-radius:0!important;padding:28px!important;margin:0!important;max-width:700px!important}.ticket *{color:#111!important}.ticket strong{font-size:30px!important;color:#111!important}.ticket .ticket-brand{font-size:24px;font-weight:900;border-bottom:2px solid #222;padding-bottom:12px;margin-bottom:18px}.ticket .ticket-label{font-size:11px;letter-spacing:2px;font-weight:800}.ticket .ticket-code{font-size:30px;font-weight:900;letter-spacing:2px;border:1px dashed #333;padding:12px;text-align:center;margin:18px 0}.ticket .ticket-payment{border-top:1px solid #aaa;padding-top:12px;margin-top:16px;font-weight:700} @page{size:A4;margin:18mm}}
</style></head><body><header class="top"><a class="brand" href="/">JO <span>STADIUM</span></a><a class="btn" href="/">← Retour au site</a></header><main class="shell"><section class="intro"><div class="eyebrow">JO STADIUM · COMPÉTITION</div><h1>Tournois de football</h1><p>Choisis un tournoi ouvert et inscris ton équipe. Le ticket est délivré après l’inscription ; les frais sont à régler sur place.</p></section><div id="notice" class="notice" role="status"></div><section id="list" class="list"><div class="empty">Chargement des tournois…</div></section></main><footer>JO STADIUM · Inscriptions aux tournois</footer><script>
const $=id=>document.getElementById(id);let tournaments=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notice(t){$('notice').textContent=t;$('notice').classList.add('show')}async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Une erreur est survenue.');return d}function dateLabel(v){if(!v)return 'Date à confirmer';const d=new Date(String(v).slice(0,10)+'T12:00:00');return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}async function load(){try{const d=await api('/api/tournaments');tournaments=d.tournaments||[];render()}catch(e){$('list').innerHTML='<div class="empty">Impossible de charger les tournois. Réessaie plus tard.</div>';notice(e.message)}}function render(){if(!tournaments.length){$('list').innerHTML='<div class="empty">Aucun tournoi ouvert pour le moment. Reviens bientôt !</div>';return}$('list').innerHTML=tournaments.map(t=>{const count=Number(t.registeredTeams)||0,max=Number(t.maxTeams)||4,full=count>=max;return `<article class="card"><h2>${esc(t.name)}</h2><div class="muted">${esc(dateLabel(t.tournamentDate))}</div>${t.description?`<p>${esc(t.description)}</p>`:''}<div class="badges"><span class="badge">👥 ${count}/${max} équipes</span><span class="badge">🏆 ${Number(t.groupCount)} groupes</span><span class="badge open">● Inscriptions ouvertes</span></div><div class="progress"><span style="width:${Math.min(100,count/max*100)}%"></span></div><div class="muted">${full?'Tournoi complet.':'Inscription gratuite en ligne · frais à régler sur place.'}</div><div class="form-actions"><button class="btn primary" type="button" data-open="${esc(t.id)}" ${full?'disabled':''}>${full?'Complet':'Inscrire mon équipe'}</button></div><form class="form" id="form-${esc(t.id)}" data-form="${esc(t.id)}"><div class="fields"><label class="field">Nom de l’équipe<input name="teamName" maxlength="80" required placeholder="Ex. Les Champions"></label><label class="field">Responsable de l’équipe<input name="captainName" maxlength="100" required placeholder="Nom complet"></label><label class="field">Téléphone<input name="phone" type="tel" maxlength="30" required placeholder="0550 00 00 00"></label></div><div class="form-actions"><button class="btn primary" type="submit">Confirmer l’inscription</button><button class="btn" data-close="${esc(t.id)}" type="button">Annuler</button></div><div class="ticket" id="ticket-${esc(t.id)}"></div></form></article>`}).join('');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{$('form-'+b.dataset.open).classList.add('opened');b.scrollIntoView({behavior:'smooth',block:'center'})});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=> $('form-'+b.dataset.close).classList.remove('opened'));document.querySelectorAll('[data-form]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const btn=f.querySelector('button[type=submit]');btn.disabled=true;try{const fd=new FormData(f);const d=await api('/api/tournaments/'+encodeURIComponent(f.dataset.form)+'/register',{method:'POST',body:JSON.stringify({teamName:fd.get('teamName'),captainName:fd.get('captainName'),phone:fd.get('phone')})});const t=$('ticket-'+f.dataset.form);t.innerHTML=`<div class="ticket-brand">JO STADIUM · TICKET TOURNOI</div><div class="ticket-label">INSCRIPTION CONFIRMÉE</div><p>Équipe : <b>${esc(d.team.teamName)}</b></p><p>Tournoi : <b>${esc(d.tournament.name)}</b></p><p>Responsable : <b>${esc(d.team.captainName||fd.get('captainName'))}</b></p><p>Téléphone : <b>${esc(d.team.phone||fd.get('phone'))}</b></p><div class="ticket-code">${esc(d.team.ticketCode)}</div><div class="ticket-payment">Paiement : À RÉGLER SUR PLACE</div><p>Conserve ce ticket et présente-le à l’organisateur le jour du tournoi.</p><button type="button" class="btn no-print" onclick="printTournamentTicket('${f.dataset.form}')">Télécharger / enregistrer en PDF</button>`;t.classList.add('show');f.closest('.card').classList.add('print-target');f.classList.add('print-ticket');f.querySelectorAll('input,button').forEach(x=>{if(x.type!=='button')x.disabled=true});notice('Équipe inscrite avec succès. Le ticket est affiché dans le formulaire.');const card=f.closest('.card');const badge=card.querySelector('.badge');const match=badge.textContent.match(/(\d+)\/(\d+)/);if(match){const next=Number(match[1])+1;badge.textContent=`👥 ${next}/${match[2]} équipes`;const bar=card.querySelector('.progress span');if(bar)bar.style.width=Math.min(100,next/Number(match[2])*100)+'%';if(next>=Number(match[2])){const open=card.querySelector('[data-open]');if(open){open.disabled=true;open.textContent='Complet'}}}}catch(err){notice(err.message)}finally{btn.disabled=false}})}
function printTournamentTicket(id){document.querySelectorAll('.print-target').forEach(c=>c.classList.remove('print-target'));document.querySelectorAll('.print-ticket').forEach(f=>f.classList.remove('print-ticket'));const form=$('form-'+id);if(!form)return;form.closest('.card').classList.add('print-target');form.classList.add('print-ticket');window.print()}
load();
</script></body></html>
