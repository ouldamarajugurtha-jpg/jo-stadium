<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JO STADIUM - Administration</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101820;
      color: #fff;
    }

    header {
      background: #172631;
      padding: 22px 15px;
      text-align: center;
      border-bottom: 3px solid #f4a340;
    }

    h1 { color: #f4a340; margin: 0; }

    main {
      max-width: 900px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: #1b2b36;
      border: 1px solid #344955;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input, button, select {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 7px;
      font-size: 16px;
    }

    input, select {
      border: 1px solid #657985;
      background: #fff;
      color: #111;
    }

    button, .link {
      border: 0;
      background: #f4a340;
      color: #101820;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
    }

    .link {
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 15px;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #40515c;
      text-align: left;
    }

    th { color: #f4a340; }

    .delete {
      width: auto;
      margin: 0;
      padding: 8px 12px;
      background: #e45c5c;
      color: white;
    }

    #message { line-height: 1.5; }

    .muted { color: #bdc7ce; }

    footer {
      text-align: center;
      padding: 20px;
      color: #bbb;
    }
  </style>
</head>
<body>

<header>
  <h1>JO STADIUM</h1>
  <p>Gestion d’administration</p>
</header>

<main>
  <a class="link" href="/">← Retour aux réservations</a>

  <section class="card">
    <h2>Accès administrateur</h2>
    <p class="muted">
      Entrez le mot de passe administrateur configuré sur le serveur.
    </p>
    <input
      id="adminPassword"
      type="password"
      placeholder="Mot de passe administrateur"
      autocomplete="current-password"
    >
    <button id="connectBtn" type="button">Accéder aux réservations</button>
    <p id="message" role="status"></p>
  </section>

  <section class="card">
    <h2>Réservations</h2>
    <button id="refreshBtn" type="button">Actualiser la liste</button>
    <p id="count">Aucune donnée chargée.</p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Nom</th>
            <th>Téléphone</th>
            <th>Date</th>
            <th>Créneau</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="bookings">
          <tr>
            <td colspan="5">Connectez-vous pour afficher les réservations.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<footer>JO STADIUM — Administration</footer>

<script>
  const passwordInput = document.getElementById('adminPassword');
  const message = document.getElementById('message');
  const bookingsBody = document.getElementById('bookings');
  const count = document.getElementById('count');

  let connected = false;

  async function loadBookings() {
    if (!connected) {
      message.textContent = 'Entrez le mot de passe administrateur.';
      return;
    }

    message.textContent = 'Chargement...';

    try {
      const response = await fetch('/api/bookings', {
        headers: {
          'x-admin-password': passwordInput.value
        }
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.message || result.error || 'Accès refusé.');
      }

      const list = Array.isArray(result)
        ? result
        : (result.bookings || []);

      bookingsBody.replaceChildren();

      if (list.length === 0) {
        const row = bookingsBody.insertRow();
        const cell = row.insertCell();
        cell.colSpan = 5;
        cell.textContent = 'Aucune réservation pour le moment.';
      } else {
        list.forEach(booking => {
          const row = bookingsBody.insertRow();

          [
            booking.name || '',
            booking.phone || '',
            booking.date || '',
            booking.time || ''
          ].forEach(value => {
            const cell = row.insertCell();
            cell.textContent = value;
          });

          const actionCell = row.insertCell();
          const deleteButton = document.createElement('button');
          deleteButton.className = 'delete';
          deleteButton.textContent = 'Supprimer';

          deleteButton.addEventListener('click', () => {
            deleteBooking(booking.id);
          });

          actionCell.appendChild(deleteButton);
        });
      }

      count.textContent = 'Nombre de réservations : ' + list.length;
      message.textContent = 'Liste actualisée.';
    } catch (error) {
      message.textContent =
        error.message === 'Failed to fetch'
          ? 'Le serveur ne répond pas.'
          : error.message;

      bookingsBody.replaceChildren();
      const row = bookingsBody.insertRow();
      const cell = row.insertCell();
      cell.colSpan = 5;
      cell.textContent = 'Impossible de charger les réservations.';
    }
  }

  async function deleteBooking(id) {
    if (id === undefined || id === null) {
      message.textContent =
        'Cette réservation ne possède pas d’identifiant. Suppression indisponible.';
      return;
    }

    if (!confirm('Voulez-vous vraiment supprimer cette réservation ?')) {
      return;
    }

    try {
      const response = await fetch(
        '/api/bookings/' + encodeURIComponent(id),
        {
          method: 'DELETE',
          headers: {
            'x-admin-password': passwordInput.value
          }
        }
      );

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.message || result.error || 'Suppression impossible.');
      }

      message.textContent = 'Réservation supprimée.';
      await loadBookings();
    } catch (error) {
      message.textContent = error.message;
    }
  }

  document.getElementById('connectBtn').addEventListener('click', async () => {
    if (!passwordInput.value) {
      message.textContent = 'Veuillez entrer le mot de passe.';
      return;
    }

    connected = true;
    await loadBookings();
  });

  document.getElementById('refreshBtn').addEventListener('click', loadBookings);

  passwordInput.addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      document.getElementById('connectBtn').click();
    }
  });
</script>

</body>
</html>
