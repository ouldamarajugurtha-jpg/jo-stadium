<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b10"><title>Tournois — JO STADIUM</title><style>
:root{color-scheme:dark;--bg:#07090e;--panel:#111720;--line:#2b3543;--text:#f5f7fb;--muted:#9ba7b8;--red:#ff3939;--green:#1fc987;--blue:#3298ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#192130 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:4;background:#080b10ed;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12;padding:14px max(16px,4vw);display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:22px;font-weight:950;letter-spacing:-.7px;text-decoration:none;color:var(--text)}.brand span{color:var(--red)}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;background:#171f2b;color:var(--text);padding:10px 13px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:linear-gradient(135deg,#ff4949,#e92335);border-color:#ff4949}.shell{width:min(1100px,calc(100% - 28px));margin:auto}.intro{padding:30px 0 16px}.eyebrow{color:#ff6d6d;letter-spacing:2.5px;font-size:11px;font-weight:950}.intro h1{font-size:clamp(32px,6vw,50px);line-height:1.06;margin:8px 0}.muted{color:var(--muted)}.notice{display:none;margin:12px 0;padding:13px 15px;border-radius:12px;border:1px solid #754047;background:#28171d}.notice.show{display:block}.list{display:grid;gap:17px;padding-bottom:55px}.card{background:linear-gradient(145deg,#141b26,#0e131b);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 12px 34px #0002}.card h2{font-size:24px;margin:0 0 5px}.badges{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.badge{border:1px solid #394554;background:#0a1018;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:850}.green{color:#74efb5;border-color:#23634b;background:#10251e}.blue{color:#86c4ff;border-color:#245b8d;background:#0d1f31}.red{color:#ff9b9b;border-color:#693b42}.progress{height:7px;background:#252d39;border-radius:999px;overflow:hidden;margin:13px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,#ff3333,#ff7967);border-radius:999px}.form{display:none;border-top:1px solid var(--line);margin-top:16px;padding-top:16px}.form.opened{display:block}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.field{display:flex;flex-direction:column;gap:6px;color:#dfe5ef;font-size:12px;font-weight:850}.field input{width:100%;min-height:45px;background:#080d13;border:1px solid #35404e;border-radius:11px;color:#fff;padding:10px 12px;font:inherit}.form-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.ticket{display:none;margin-top:14px;padding:16px;border:1px dashed #2d8b64;background:#10241d;border-radius:13px}.ticket.show{display:block}.ticket-code{font-size:24px;letter-spacing:2px;font-weight:950;text-align:center;border:1px dashed #65bd94;padding:10px;margin:12px 0}.section-title{font-size:19px;margin:25px 0 10px}.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.group{background:#0a1017;border:1px solid #2b3542;border-radius:14px;padding:13px;min-width:0}.group h3{font-size:14px;margin:0 0 8px}.team{padding:7px 0;border-top:1px solid #252d39;font-size:12px;overflow-wrap:anywhere}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #36404e;border-radius:14px}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:13px;margin:12px 0}table{width:100%;border-collapse:collapse;min-width:620px;font-size:12px}th,td{text-align:left;padding:9px;border-bottom:1px solid #27303c}th{background:#171f2a;color:#b9c4d4}tr:last-child td{border-bottom:0}.qualify{background:#123024}.third{background:#10243a}.matches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.match{border:1px solid var(--line);border-radius:13px;padding:13px;background:#0a1017}.match-top{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px}.match-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:10px 0;font-weight:850}.match-teams span:last-child{text-align:right}.score{font-size:20px;white-space:nowrap}.foot{border-top:1px solid #ffffff12;padding:22px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:700px){.top{padding:12px 14px}.brand{font-size:19px}.shell{width:calc(100% - 20px)}.card{padding:15px}.fields,.groups,.matches{grid-template-columns:1fr}.intro{padding-top:24px}.form-actions .btn{flex:1}}
</style></head><body><header class="top"><a class="brand" href="/">JO <span>STADIUM</span></a><a class="btn" href="/">← Retour au site</a></header><main class="shell"><section class="intro"><div class="eyebrow">JO STADIUM · COMPÉTITION</div><h1>Tournois de football</h1><p class="muted">Inscris ton équipe, consulte le calendrier, les résultats et le classement en direct après chaque mise à jour de l'organisateur.</p></section><div id="notice" class="notice" role="status"></div><section id="list" class="list"><div class="empty">Chargement des tournois…</div></section></main><footer class="foot">JO STADIUM · Résultats et classements mis à jour par l'organisateur</footer><script>
const $=id=>document.getElementById(id);let tournaments=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notice(t){$('notice').textContent=t;$('notice').classList.add('show')}async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})},cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Erreur HTTP ${r.status}`);return d}function dateLabel(v){if(!v)return'Date à confirmer';const d=new Date(String(v).slice(0,10)+'T12:00:00');return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}function distribute(teams,count){const gs=Array.from({length:count},(_,i)=>({name:'Groupe '+String.fromCharCode(65+i),teams:[]}));(teams||[]).forEach((t,i)=>gs[i%count].teams.push(t));return gs}function standings(t,g){const rows=g.teams.map(team=>({id:team.id,name:team.teamName,mp:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,y:0,r:0}));const by=new Map(rows.map(r=>[r.id,r]));(t.matches||[]).filter(m=>m.groupName===g.name&&m.homeScore!==null&&m.homeScore!==undefined&&m.awayScore!==null&&m.awayScore!==undefined).forEach(m=>{const a=by.get(m.homeTeamId),b=by.get(m.awayTeamId);if(!a||!b)return;const x=+m.homeScore,y=+m.awayScore;a.mp++;b.mp++;a.gf+=x;a.ga+=y;b.gf+=y;b.ga+=x;a.y+=+m.homeYellow||0;b.y+=+m.awayYellow||0;a.r+=+m.homeRed||0;b.r+=+m.awayRed||0;if(x>y){a.w++;b.l++;a.pts+=3}else if(x<y){b.w++;a.l++;b.pts+=3}else{a.d++;b.d++;a.pts++;b.pts++}});return rows.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.name.localeCompare(b.name))}function allStandings(t){return distribute(t.teams||[],+t.groupCount).map(g=>({group:g.name,rows:standings(t,g)}))}function qualify(t,all){const third=all.flatMap(g=>g.rows[2]?[{...g.rows[2],group:g.group}]:[]).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.name.localeCompare(b.name)).slice(0,+t.bestThirds||0);return new Set(third.map(x=>x.id))}function standingsTable(t,g,thirdIds){return `<div class="table-wrap"><table><thead><tr><th>#</th><th>Équipe</th><th>MJ</th><th>V</th><th>N</th><th>D</th><th>BP</th><th>BC</th><th>Diff.</th><th>Pts</th><th>🟨</th><th>🟥</th><th>Qualification</th></tr></thead><tbody>${g.rows.map((r,i)=>`<tr class="${i<2?'qualify':thirdIds.has(r.id)?'third':''}"><td>${i+1}</td><td><b>${esc(r.name)}</b></td><td>${r.mp}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td>${r.gf-r.ga>0?'+':''}${r.gf-r.ga}</td><td><b>${r.pts}</b></td><td>${r.y}</td><td>${r.r}</td><td>${i<2?'<span class="badge green">Qualifié</span>':thirdIds.has(r.id)?'<span class="badge blue">Meilleur 3e</span>':'—'}</td></tr>`).join('')}</tbody></table></div>`}function matchDate(m){let s='Date à confirmer';if(m.matchDate)s=dateLabel(m.matchDate);if(m.matchTime)s+=' · '+String(m.matchTime).slice(0,5);return s}async function load(){try{const d=await api('/api/tournaments');tournaments=d.tournaments||[];render();}catch(e){$('list').innerHTML='<div class="empty">Impossible de charger les tournois. Réessaie plus tard.</div>';notice(e.message)}}function render(){if(!tournaments.length){$('list').innerHTML='<div class="empty">Aucun tournoi pour le moment.</div>';return}$('list').innerHTML=tournaments.map(t=>{const teams=t.teams||[],count=Number(t.registeredTeams)||teams.length,max=+t.maxTeams,full=count>=max,open=t.status==='open',groups=distribute(teams,+t.groupCount),all=allStandings(t),thirdIds=qualify(t,all);return `<article class="card"><h2>${esc(t.name)}</h2><div class="muted">${esc(dateLabel(t.tournamentDate))}</div>${t.description?`<p>${esc(t.description)}</p>`:''}<div class="badges"><span class="badge">👥 ${count}/${max} équipes</span><span class="badge">🏆 ${t.groupCount} groupes</span>${+t.bestThirds?`<span class="badge blue">${t.bestThirds} meilleurs troisièmes possibles</span>`:''}<span class="badge ${open?'green':'red'}">${open?'Inscriptions ouvertes':'Inscriptions fermées'}</span></div><div class="progress"><span style="width:${Math.min(100,count/max*100)}%"></span></div><p class="muted">${full?'Tournoi complet.':open?'Inscription en ligne · frais à régler sur place.':'Les inscriptions sont fermées. Consulte les résultats ci-dessous.'}</p>${open?`<div class="form-actions"><button class="btn primary" type="button" data-open="${esc(t.id)}" ${full?'disabled':''}>${full?'Tournoi complet':'Inscrire mon équipe'}</button></div><form class="form" data-form="${esc(t.id)}"><div class="fields"><label class="field">Nom de l’équipe<input name="teamName" maxlength="80" required placeholder="Ex. Les Champions"></label><label class="field">Responsable<input name="captainName" maxlength="100" required placeholder="Nom complet"></label><label class="field">Téléphone<input name="phone" type="tel" maxlength="30" required placeholder="0550 00 00 00"></label></div><div class="form-actions"><button class="btn primary" type="submit">Confirmer l’inscription</button><button class="btn" data-close="${esc(t.id)}" type="button">Annuler</button></div><div class="ticket" data-ticket="${esc(t.id)}"></div></form>`:''}<h3 class="section-title">Classement des groupes</h3><div class="badges"><span class="badge green">Vert : 1er et 2e de chaque groupe</span><span class="badge blue">Bleu : meilleurs troisièmes qualifiés</span></div><div class="groups">${groups.map(g=>`<section class="group"><h3>${esc(g.name)} · ${g.teams.length} équipe(s)</h3>${g.teams.map(x=>`<div class="team">${esc(x.teamName)}</div>`).join('')||'<div class="muted">Équipes en attente</div>'}</section>`).join('')}</div>${all.map(g=>`<h3 class="section-title">${esc(g.group)} · Classement</h3>${standingsTable(t,g,thirdIds)}`).join('')}<h3 class="section-title">Calendrier et résultats</h3><div class="matches">${(t.matches||[]).map(m=>`<div class="match"><div class="match-top"><span>${esc(m.groupName)}</span><span>${esc(matchDate(m))}</span></div><div class="match-teams"><span>${esc(m.homeTeam)}</span><span class="score">${m.homeScore===null||m.homeScore===undefined?'—':`${m.homeScore} : ${m.awayScore}`}</span><span>${esc(m.awayTeam)}</span></div><div class="muted" style="font-size:11px">🟨 ${m.homeYellow||0} — ${m.awayYellow||0} &nbsp; · &nbsp; 🟥 ${m.homeRed||0} — ${m.awayRed||0}</div></div>`).join('')||'<div class="empty" style="grid-column:1/-1">Le calendrier et les résultats seront affichés dès que l’organisateur les aura publiés.</div>'}</div></article>`}).join('');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const f=document.querySelector(`[data-form="${CSS.escape(b.dataset.open)}"]`);f?.classList.add('opened');f?.scrollIntoView({behavior:'smooth',block:'center'})});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.querySelector(`[data-form="${CSS.escape(b.dataset.close)}"]`)?.classList.remove('opened'));document.querySelectorAll('[data-form]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const btn=f.querySelector('button[type=submit]');btn.disabled=true;const fd=new FormData(f);try{const d=await api('/api/tournaments/'+encodeURIComponent(f.dataset.form)+'/register',{method:'POST',body:JSON.stringify({teamName:fd.get('teamName'),captainName:fd.get('captainName'),phone:fd.get('phone')})});const t=f.querySelector('[data-ticket]');t.innerHTML=`<b>JO STADIUM · TICKET TOURNOI</b><p>Inscription confirmée pour <b>${esc(d.team.teamName)}</b>.</p><p>Tournoi : ${esc(d.tournament.name)}<br>Responsable : ${esc(d.team.captainName)}<br>Téléphone : ${esc(d.team.phone)}</p><div class="ticket-code">${esc(d.team.ticketCode)}</div><b>Paiement : À RÉGLER SUR PLACE</b><p>Conserve ce code et présente-le à l’organisateur.</p><button type="button" class="btn" onclick="window.print()">Imprimer le ticket</button>`;t.classList.add('show');f.querySelectorAll('input').forEach(i=>i.disabled=true);notice('Inscription enregistrée avec succès.');await load()}catch(e){notice(e.message)}finally{btn.disabled=false}})}load();setInterval(load,45000);
</script></body></html>
