<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b10"><title>Tournois — JO STADIUM</title><style>
:root{--bg:#070a0f;--panel:#111821;--line:#2b3542;--text:#f5f7fb;--muted:#9aa6b6;--red:#ff3b30;--green:#27d58a;--blue:#4d9eff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5}a{color:inherit;text-decoration:none}.top{position:sticky;top:0;z-index:2;background:#080b10ed;border-bottom:1px solid #ffffff16;padding:14px max(16px,5vw);display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:21px;font-weight:950}.brand span{color:var(--red)}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:9px;padding:10px 13px;background:#171f2a;color:white;font-weight:800;cursor:pointer}.primary{background:var(--red);border-color:var(--red)}.shell{width:min(1100px,calc(100% - 24px));margin:auto}.intro{padding:28px 0 15px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:900;color:#ff716a}.intro h1{font-size:clamp(30px,6vw,46px);line-height:1.05;margin:7px 0}.muted{color:var(--muted)}.notice{display:none;padding:12px;border:1px solid #6a393b;background:#251719;border-radius:10px;margin:12px 0}.notice.show{display:block}.list{display:grid;gap:16px;padding-bottom:45px}.card{background:linear-gradient(145deg,#141b25,#0d1219);border:1px solid var(--line);border-radius:16px;padding:17px}.card h2{margin:0 0 5px;font-size:24px}.badges{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.badge{font-size:12px;border:1px solid #35404f;background:#080d13;border-radius:99px;padding:5px 9px}.open{color:#7ce7b6;border-color:#235c46}.closed{color:#ff9994;border-color:#6a3538}.progress{height:7px;background:#252d39;border-radius:99px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:var(--red)}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:800;color:#dfe5ed}.field input{width:100%;min-height:43px;border:1px solid #35404f;border-radius:9px;background:#080d13;color:#fff;padding:10px;font:inherit}.form{display:none;border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.form.opened{display:block}.form-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.ticket{display:none;margin-top:13px;padding:14px;border:1px dashed #2d8b64;background:#10241d;border-radius:11px}.ticket.show{display:block}.ticket-code{font-size:24px;font-weight:950;letter-spacing:2px;color:#8af0bc}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 9px}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.group{border:1px solid var(--line);border-radius:11px;padding:10px;background:#0b1016;overflow:auto}.group h3{margin:0 0 8px;font-size:14px}.standing{width:100%;border-collapse:collapse;font-size:12px}.standing th,.standing td{padding:8px 5px;border-bottom:1px solid #28313c;text-align:center;white-space:nowrap}.standing th:first-child,.standing td:first-child{text-align:left;white-space:normal}.qualified{background:#103325}.best-third{background:#102a45}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:10px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;border:1px solid var(--line);background:#0b1016;border-radius:11px;padding:12px;margin:8px 0}.team-name{font-weight:850;overflow-wrap:anywhere}.team-name:last-child{text-align:right}.score{font-size:21px;font-weight:950;white-space:nowrap}.match-meta{grid-column:1/-1;border-top:1px solid #27303c;padding-top:7px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.match-status{font-weight:900;color:#8af0bc}.cards-line{color:#d6deea}.empty{padding:24px;text-align:center;border:1px dashed #35404f;border-radius:14px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:22px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:650px){.fields{grid-template-columns:1fr}.top{padding:12px 14px}.brand{font-size:19px}.card{padding:14px}.match{gap:6px;padding:9px}.score{font-size:18px}}
</style></head><body><header class="top"><a class="brand" href="/">JO <span>STADIUM</span></a><a class="btn" href="/">← Retour au site</a></header><main class="shell"><section class="intro"><div class="eyebrow">JO STADIUM · COMPÉTITION</div><h1>Tournois de football</h1><p class="muted">Inscris ton équipe, consulte le calendrier et suis les résultats et classements mis à jour après chaque résultat validé.</p></section><div id="notice" class="notice" role="status"></div><section id="list" class="list"><div class="empty">Chargement des tournois…</div></section></main><footer>JO STADIUM · Calendriers, résultats et classements</footer><script>
const $=id=>document.getElementById(id);let tournaments=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notice(t){$('notice').textContent=t;$('notice').classList.add('show')}async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Une erreur est survenue.');return d}function dateLabel(v){if(!v)return 'Date à confirmer';return new Date(String(v).slice(0,10)+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}function timeLabel(v){return v?String(v).slice(0,5):'Heure à confirmer'}function standings(t){return `<div class="groups">${(t.standings||[]).map(g=>`<div class="group"><h3>${esc(g.name)}</h3><table class="standing"><thead><tr><th>Équipe</th><th>MJ</th><th>V</th><th>N</th><th>D</th><th>Diff.</th><th>Pts</th></tr></thead><tbody>${(g.standings||[]).map(x=>`<tr class="${x.qualification==='qualified'?'qualified':x.qualification==='best-third'?'best-third':''}"><td>${esc(x.teamName)}${x.qualification==='qualified'?' 🟢':x.qualification==='best-third'?' 🔵':''}</td><td>${x.played}</td><td>${x.wins}</td><td>${x.draws}</td><td>${x.losses}</td><td>${x.goalDifference>0?'+':''}${x.goalDifference}</td><td><b>${x.points}</b></td></tr>`).join('')||'<tr><td colspan="7">Aucune équipe</td></tr>'}</tbody></table></div>`).join('')}</div><div class="legend"><span><i class="dot" style="background:#27d58a"></i>Deux premiers qualifiés</span>${Number(t.bestThirdCount)>0?'<span><i class="dot" style="background:#4d9eff"></i>Meilleurs troisièmes qualifiés</span>':''}</div>`}function matchList(t){const arr=t.matches||[];if(!arr.length)return '<div class="empty">Le calendrier des matchs sera publié ici.</div>';return arr.map(m=>`<div class="match"><div class="team-name">${esc(m.homeTeamName)}</div><div class="score">${m.status==='finished'?`${m.homeGoals} – ${m.awayGoals}`:'VS'}</div><div class="team-name">${esc(m.awayTeamName)}</div><div class="match-meta"><span>${esc(m.groupName||'Tournoi')} · ${m.matchDate?dateLabel(m.matchDate):'Date à définir'} · ${timeLabel(m.matchTime)}</span><span class="match-status">${m.status==='finished'?'TERMINÉ':'À VENIR'}</span>${m.status==='finished'?`<span class="cards-line">🟨 ${m.homeYellow}–${m.awayYellow} · 🟥 ${m.homeRed}–${m.awayRed}</span>`:''}</div></div>`).join('')}async function load(){try{const d=await api('/api/tournaments');tournaments=d.tournaments||[];render()}catch(e){$('list').innerHTML='<div class="empty">Impossible de charger les tournois. Réessaie plus tard.</div>';notice(e.message)}}function render(){if(!tournaments.length){$('list').innerHTML='<div class="empty">Aucun tournoi pour le moment. Reviens bientôt !</div>';return}$('list').innerHTML=tournaments.map(t=>{const count=Number(t.registeredTeams)||0,max=Number(t.maxTeams)||4,full=count>=max,open=t.status==='open';return `<article class="card"><h2>${esc(t.name)}</h2><div class="muted">${esc(dateLabel(t.tournamentDate))}</div>${t.description?`<p>${esc(t.description)}</p>`:''}<div class="badges"><span class="badge">👥 ${count}/${max} équipes</span><span class="badge">🏆 ${Number(t.groupCount)} groupes</span><span class="badge ${open?'open':'closed'}">${open?'● Inscriptions ouvertes':'● Inscriptions fermées'}</span><span class="badge">Meilleurs 3e : ${t.bestThirdCount?`${t.bestThirdCount} place(s)`:'désactivé'}</span></div><div class="progress"><span style="width:${Math.min(100,count/max*100)}%"></span></div><div class="muted">${full?'Tournoi complet.':open?'Inscription gratuite en ligne · frais à régler sur place.':'Les inscriptions sont fermées.'}</div>${open?`<div class="form-actions"><button class="btn primary" type="button" data-open="${esc(t.id)}" ${full?'disabled':''}>${full?'Complet':'Inscrire mon équipe'}</button></div><form class="form" id="form-${esc(t.id)}" data-form="${esc(t.id)}"><div class="fields"><label class="field">Nom de l’équipe<input name="teamName" maxlength="80" required placeholder="Ex. Les Champions"></label><label class="field">Responsable de l’équipe<input name="captainName" maxlength="100" required placeholder="Nom complet"></label><label class="field">Téléphone<input name="phone" type="tel" maxlength="30" required placeholder="0550 00 00 00"></label></div><div class="form-actions"><button class="btn primary" type="submit">Confirmer l’inscription</button><button class="btn" data-close="${esc(t.id)}" type="button">Annuler</button></div><div class="ticket" id="ticket-${esc(t.id)}"></div></form>`:''}<div class="section-title"><h3>📅 Calendrier et résultats</h3></div>${matchList(t)}<div class="section-title"><h3>📊 Classement des groupes</h3></div>${standings(t)}</article>`}).join('');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{$('form-'+b.dataset.open).classList.add('opened');$('form-'+b.dataset.open).scrollIntoView({behavior:'smooth',block:'center'})});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=> $('form-'+b.dataset.close).classList.remove('opened'));document.querySelectorAll('[data-form]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const btn=f.querySelector('button[type=submit]');btn.disabled=true;try{const fd=new FormData(f);const d=await api('/api/tournaments/'+encodeURIComponent(f.dataset.form)+'/register',{method:'POST',body:JSON.stringify({teamName:fd.get('teamName'),captainName:fd.get('captainName'),phone:fd.get('phone')})});const t=$('ticket-'+f.dataset.form);t.innerHTML=`<b>JO STADIUM · TICKET TOURNOI</b><p>Inscription confirmée pour <strong>${esc(d.team.teamName)}</strong></p><p>Tournoi : ${esc(d.tournament.name)} · Responsable : ${esc(d.team.captainName)} · Téléphone : ${esc(d.team.phone)}</p><div class="ticket-code">${esc(d.team.ticketCode)}</div><p>Frais à régler sur place. Conserve ce code et présente-le à l’organisateur.</p><button class="btn" type="button" data-print-ticket>Imprimer / enregistrer en PDF</button>`;t.classList.add('show');f.querySelectorAll('input,button').forEach(x=>{if(x.type!=='button')x.disabled=true});t.querySelector('[data-print-ticket]').onclick=()=>window.print();notice('Équipe inscrite avec succès.');await load()}catch(err){notice(err.message)}finally{btn.disabled=false}})}load();setInterval(load,30000);
</script></body></html>
