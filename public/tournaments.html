.group{border-color:#4a2029;box-shadow:0 0 0 1px #ff27350b,0 0 22px #ff1f3512}.group h3{color:#fff;text-shadow:0 0 12px #ff293c55}.standing thead th{color:#ff777f;text-shadow:0 0 10px #ff293c44}.standing tr.qualified{box-shadow:inset 3px 0 #ff3b45}.standing tr.qualified td:first-child{color:#fff;text-shadow:0 0 10px #ff253d44}.standing tr.best-third{box-shadow:inset 3px 0 #ff9f43}.champion-banner{border:1px solid #ff4858!important;box-shadow:0 0 22px #ff243d35,inset 0 0 28px #ff243d12!important}.trophy{filter:drop-shadow(0 0 12px #ffb52e)}.champion-name{text-shadow:0 0 16px #ff273d88!important}</style></head><body><header class="top"><a class="brand" href="/">JO <span>STADIUM</span></a><a class="btn" href="/">← Retour au site</a></header><main class="shell"><section class="intro"><div class="eyebrow">JO STADIUM · COMPÉTITION</div><h1>Tournois de football</h1><p class="muted">Inscris ton équipe, consulte le calendrier et suis les résultats et classements mis à jour après chaque résultat validé.</p></section><div id="notice" class="notice" role="status"></div><section id="list" class="list"><div class="empty">Chargement des tournois…</div></section></main><footer>JO STADIUM · Calendriers, résultats et classements</footer><script>
'use strict';
const $ = id => document.getElementById(id);
let tournaments = [];
const openForms = new Set();
const memoryTickets = new Map();
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(message){ $('notice').textContent=message; $('notice').classList.add('show'); }
async function api(url, options={}){
  const response=await fetch(url,{...options,cache:'no-store',headers:{'Content-Type':'application/json',...(options.headers||{})}});
  const data=await response.json().catch(()=>({}));
  if(!response.ok){const error=new Error(data.error||'Une erreur est survenue.');error.status=response.status;throw error;}
  return data;
}
function dateLabel(value){if(!value)return 'Date à confirmer';return new Date(String(value).slice(0,10)+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});}
function timeLabel(value){return value?String(value).slice(0,5):'Heure à confirmer';}
function ticketStorageKey(id){return `joStadiumTournamentTickets:${id}`;}
function readTickets(id){try{const data=JSON.parse(localStorage.getItem(ticketStorageKey(id))||'[]');if(Array.isArray(data)&&data.length)return data;}catch(_){}return memoryTickets.get(id)||[];}
function saveTicket(id,ticket){const tickets=[...readTickets(id),ticket];memoryTickets.set(id,tickets);try{localStorage.setItem(ticketStorageKey(id),JSON.stringify(tickets));}catch(_){notice('Inscription confirmée. Le ticket reste affiché dans cette session : enregistre-le en PDF avant de quitter la page.');}return tickets;}
function ticketMarkup(ticket,index){return `<div class="ticket saved show" data-saved-ticket="${index}"><div class="ticket-caption">JO STADIUM · TICKET D’INSCRIPTION</div><p>Inscription confirmée pour <strong>${esc(ticket.team?.teamName)}</strong></p><p>Tournoi : ${esc(ticket.tournament?.name)} · Responsable : ${esc(ticket.team?.captainName)} · Téléphone : ${esc(ticket.team?.phone)}</p><p class="ticket-group">Groupe attribué automatiquement : <strong>${esc(ticket.team?.groupName||'À confirmer')}</strong></p><div class="ticket-code">${esc(ticket.team?.ticketCode)}</div><p>Frais à régler selon les modalités du tournoi. Conserve ce ticket et présente son code à l’organisateur.</p><div class="ticket-actions"><button class="btn" type="button" data-print-ticket="${index}">Imprimer / enregistrer en PDF</button><button class="btn" type="button" data-copy-ticket="${index}">Copier le code</button></div></div>`;}
function renderTicketList(tournamentId,container){const tickets=readTickets(tournamentId);container.innerHTML=tickets.map(ticketMarkup).join('');container.querySelectorAll('[data-print-ticket]').forEach(button=>button.addEventListener('click',()=>{const ticket=button.closest('.ticket');if(!ticket)return;document.querySelectorAll('.ticket.print-target').forEach(node=>node.classList.remove('print-target'));ticket.classList.add('print-target');document.body.classList.add('print-ticket-mode');const cleanup=()=>{document.body.classList.remove('print-ticket-mode');ticket.classList.remove('print-target');window.removeEventListener('afterprint',cleanup);};window.addEventListener('afterprint',cleanup);window.print();setTimeout(cleanup,1800);}));container.querySelectorAll('[data-copy-ticket]').forEach(button=>button.addEventListener('click',async()=>{const ticket=tickets[Number(button.dataset.copyTicket)];try{await navigator.clipboard.writeText(ticket.team.ticketCode);notice('Code du ticket copié.');}catch(_){notice(`Code du ticket : ${ticket.team.ticketCode}`);}}));}
function standings(tournament){
  return `<div class="groups">${(tournament.standings||[]).map(group=>`<div class="group"><h3>${esc(group.name)}</h3><table class="standing"><thead><tr><th>Équipe</th><th>MJ</th><th>V</th><th>N</th><th>D</th><th>Diff.</th><th>Pts</th></tr></thead><tbody>${(group.standings||[]).map((team,index)=>{
    const dot=team.qualification==='qualified'?'<span class="qualification-dot blue" title="Place qualificative" aria-label="Place qualificative"></span>':team.qualification==='best-third'?'<span class="qualification-dot red" title="Meilleur troisième qualifié" aria-label="Meilleur troisième qualifié"></span>':'';
    const rowClass=team.qualification==='qualified'?'qualified':team.qualification==='best-third'?'best-third':'';
    return `<tr class="${rowClass}"><td><div class="team-cell"><span class="team-rank">${index+1}.</span>${dot}<span class="team-cell-name">${esc(team.teamName)}</span></div></td><td>${team.played}</td><td>${team.wins}</td><td>${team.draws}</td><td>${team.losses}</td><td>${team.goalDifference>0?'+':''}${team.goalDifference}</td><td><b>${team.points}</b></td></tr>`;
  }).join('')||'<tr><td colspan="7">Aucune équipe inscrite</td></tr>'}</tbody></table></div>`).join('')}</div><div class="legend"><span><i class="qualification-dot blue"></i> Deux premières places qualificatives</span>${Number(tournament.bestThirdCount)>0?'<span><i class="qualification-dot red"></i> Meilleur troisième (option activée)</span>':''}</div>`;
}
function initials(name){return String(name||'??').trim().split(/\s+/).slice(0,2).map(part=>part.charAt(0)).join('').toUpperCase()||'??';}
function matchList(tournament){
  const matches=[...(tournament.matches||[])].sort((a,b)=>(String(a.matchDate||'9999-12-31')+' '+String(a.matchTime||'23:59')).localeCompare(String(b.matchDate||'9999-12-31')+' '+String(b.matchTime||'23:59')));
  if(!matches.length)return '<div class="calendar-empty">📅 Aucun match programmé pour le moment.<br><span class="muted">Le calendrier complet sera créé automatiquement après le tirage au sort de l’administrateur.</span></div>';
  let previousDay='';
  const rows=matches.map(match=>{
    const day=match.matchDate?String(match.matchDate).slice(0,10):'date-a-confirmer';
    const dayTitle=match.matchDate?dateLabel(match.matchDate):'Date à confirmer';
    const separator=day!==previousDay?`<div class="matchday">${esc(dayTitle)} <span style="float:right;color:#ff777e">${match.matchDate?timeLabel(match.matchTime):'Horaire à confirmer'}</span></div>`:'';
    previousDay=day;
    const done=match.status==='finished',bye=match.status==='bye';
    const homeName=match.homeTeamId?match.homeTeamName:'EXEMPT',awayName=match.awayTeamId?match.awayTeamName:'EXEMPT';
    const score=bye?'BYE':done?`${esc(match.homeGoals)} – ${esc(match.awayGoals)}${match.homePenalties!=null&&match.awayPenalties!=null?` (${esc(match.homePenalties)}–${esc(match.awayPenalties)} t.a.b.)`:''}`:'VS';
    return `${separator}<article class="match ${done||bye?'finished':'upcoming'}" data-match-row data-match-status="${done||bye?'finished':'upcoming'}" data-match-group="${esc(match.groupName||'Phase éliminatoire')}"><div class="team-block home"><span class="team-mark">${esc(initials(homeName))}</span><div class="team-name">${esc(homeName)}</div></div><div class="scorebox">${done||bye?`<div class="score finished-score">${score}</div><span class="score-caption">${bye?'QUALIFIÉ':'SCORE FINAL'}</span>`:`<div class="score score-vs">VS</div><span class="score-caption">${esc(timeLabel(match.matchTime))}</span>`}</div><div class="team-block away"><div class="team-name">${esc(awayName)}</div><span class="team-mark">${esc(initials(awayName))}</span></div><div class="match-meta"><div class="match-meta-main"><span>${esc(match.phase==='knockout'?(match.roundName||'Phase éliminatoire'):[match.groupName,match.roundName].filter(Boolean).join(' · ')||'Tournoi')}</span><span>·</span><span>${esc(timeLabel(match.matchTime))}</span></div><span class="match-status ${done||bye?'done':'soon'}">${bye?'QUALIFIÉ':done?'TERMINÉ':'À VENIR'}</span>${done?`<span class="cards-line">🟨 ${Number(match.homeYellow)||0}–${Number(match.awayYellow)||0} &nbsp; 🟥 ${Number(match.homeRed)||0}–${Number(match.awayRed)||0}</span>`:''}</div></article>`;
  }).join('');
  const finalMatch=matches.find(m=>m.phase==='knockout' && /finale/i.test(String(m.roundName||'')) && m.status==='finished' && (Number(m.homeGoals)!==Number(m.awayGoals) || (m.homePenalties!=null && m.awayPenalties!=null && Number(m.homePenalties)!==Number(m.awayPenalties))));
  let champion='';
  if(finalMatch){const home=finalMatch.homeTeamName||finalMatch.homeTeam||finalMatch.homeName;const away=finalMatch.awayTeamName||finalMatch.awayTeam||finalMatch.awayName;const homeGoals=Number(finalMatch.homeGoals??finalMatch.homeScore),awayGoals=Number(finalMatch.awayGoals??finalMatch.awayScore);const homeWins=homeGoals===awayGoals&&finalMatch.homePenalties!=null&&finalMatch.awayPenalties!=null?Number(finalMatch.homePenalties)>Number(finalMatch.awayPenalties):homeGoals>awayGoals;const winner=homeWins?home:away;if(winner)champion=`<section class="champion-banner" aria-label="Vainqueur du tournoi"><div class="trophy">🏆</div><h3>Champion du tournoi</h3><div class="champion-name">${esc(winner)}</div><div class="champion-sub">JO STADIUM · VAINQUEUR DE LA FINALE</div></section>`;}
  const groupNames=[...new Set(matches.filter(m=>m.phase!=='knockout'&&m.groupName).map(m=>m.groupName))]; const groupButtons=groupNames.map(g=>`<button type="button" class="match-filter" data-match-group="${esc(g)}">${esc(g)}</button>`).join(''); return `<div class="matches-toolbar" role="group" aria-label="Filtrer le calendrier"><button type="button" class="match-filter active" data-match-filter="all">Tous les matchs <b>${matches.length}</b></button><button type="button" class="match-filter" data-match-filter="upcoming">À venir <b>${matches.filter(m=>m.status==='scheduled').length}</b></button><button type="button" class="match-filter" data-match-filter="finished">Résultats <b>${matches.filter(m=>m.status==='finished'||m.status==='bye').length}</b></button>${groupButtons}</div><div class="match-list">${rows}</div>${champion}`;
}
function saveDraft(form){const values={};new FormData(form).forEach((value,key)=>values[key]=String(value));try{sessionStorage.setItem(`joStadiumTournamentDraft:${form.dataset.form}`,JSON.stringify(values));}catch(_){} }
function restoreDraft(form){try{const draft=JSON.parse(sessionStorage.getItem(`joStadiumTournamentDraft:${form.dataset.form}`)||'null');if(!draft)return false;let hasValue=false;for(const [key,value] of Object.entries(draft)){const input=form.elements.namedItem(key);if(input&&value){input.value=value;hasValue=true;}}if(hasValue)form.classList.add('opened');return hasValue;}catch(_){return false;}}
function render(){
  if(!tournaments.length){$('list').innerHTML='<div class="empty">Aucun tournoi pour le moment. Reviens bientôt !</div>';return;}
  $('list').innerHTML=tournaments.map(tournament=>{
    const count=Number(tournament.registeredTeams)||0,max=Number(tournament.maxTeams)||4,full=count>=max,open=tournament.status==='open';
    const form=open?`<div class="form-actions"><button class="btn primary" type="button" data-open="${esc(tournament.id)}" ${full?'disabled':''}>${full?'Complet':'Inscrire mon équipe'}</button></div><form class="form" id="form-${esc(tournament.id)}" data-form="${esc(tournament.id)}"><div class="fields"><label class="field">Nom de l’équipe<input name="teamName" maxlength="80" required placeholder="Ex. Les Champions" autocomplete="organization"></label><label class="field">Responsable de l’équipe<input name="captainName" maxlength="100" required placeholder="Nom complet" autocomplete="name"></label><label class="field">Téléphone<input name="phone" type="tel" maxlength="30" required placeholder="0550 00 00 00" autocomplete="tel"></label></div><p class="registration-help">L’inscription ne recharge pas la page. Ton ticket restera visible après actualisation.</p><div class="form-actions"><button class="btn primary" type="submit">Confirmer l’inscription</button><button class="btn" data-close="${esc(tournament.id)}" type="button">Fermer le formulaire</button></div></form>`:'';
    return `<article class="card" data-tournament-card="${esc(tournament.id)}"><h2>${esc(tournament.name)}</h2><div class="muted">${esc(dateLabel(tournament.tournamentDate))}</div>${tournament.description?`<p>${esc(tournament.description)}</p>`:''}<div class="badges"><span class="badge" data-count-label="${esc(tournament.id)}">👥 <b data-count>${count}</b>/${max} équipes</span><span class="badge">🏆 ${Number(tournament.groupCount)} groupes</span><span class="badge ${open?'open':'closed'}">${open?'● Inscriptions ouvertes':'● Inscriptions fermées'}</span><span class="badge">Meilleurs 3e : ${tournament.bestThirdCount?`${tournament.bestThirdCount} place(s)`:'désactivé'}</span></div><div class="progress"><span data-progress="${esc(tournament.id)}" style="width:${Math.min(100,count/max*100)}%"></span></div><div class="muted">${full?'Tournoi complet.':open?'Inscription en ligne · frais selon les modalités du tournoi.':'Les inscriptions sont fermées.'}</div>${form}<div class="ticket-list" data-ticket-list="${esc(tournament.id)}" style="${open?'':'display:none'}"></div><div class="section-title"><h3>📅 Calendrier et résultats</h3></div>${matchList(tournament)}<div class="section-title"><h3>📊 Classement des groupes</h3></div>${standings(tournament)}</article>`;
  }).join('');
  document.querySelectorAll('[data-ticket-list]').forEach(container=>renderTicketList(container.dataset.ticketList,container));
  document.querySelectorAll('[data-open]').forEach(button=>button.addEventListener('click',()=>{const form=$('form-'+button.dataset.open);if(!form)return;form.classList.add('opened');openForms.add(button.dataset.open);form.scrollIntoView({behavior:'smooth',block:'center'});}));
  document.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>{const id=button.dataset.close;const form=$('form-'+id);if(form)form.classList.remove('opened');openForms.delete(id);}));
  document.querySelectorAll('[data-form]').forEach(form=>{
    const restored=restoreDraft(form);if(restored)openForms.add(form.dataset.form);
    form.addEventListener('input',()=>saveDraft(form));
    form.addEventListener('change',()=>saveDraft(form));
    form.addEventListener('submit',async event=>{
      event.preventDefault();if(form.dataset.submitting==='1')return;
      const button=form.querySelector('button[type="submit"]');if(!form.reportValidity())return;
      form.dataset.submitting='1';button.disabled=true;button.textContent='Inscription en cours…';
      try{
        const values=new FormData(form);
        const result=await api('/api/tournaments/'+encodeURIComponent(form.dataset.form)+'/register',{method:'POST',body:JSON.stringify({teamName:values.get('teamName'),captainName:values.get('captainName'),phone:values.get('phone')})});
        const ticket={team:result.team,tournament:result.tournament,createdAt:new Date().toISOString()};
        const tickets=saveTicket(form.dataset.form,ticket);
        try{sessionStorage.removeItem(`joStadiumTournamentDraft:${form.dataset.form}`);}catch(_){}
        form.reset();form.classList.add('opened');openForms.add(form.dataset.form);
        const card=form.closest('[data-tournament-card]');const list=card.querySelector('[data-ticket-list]');renderTicketList(form.dataset.form,list);
        const countEl=card.querySelector('[data-count]');const newCount=(Number(countEl?.textContent)||0)+1;if(countEl)countEl.textContent=String(newCount);
        const tournament=tournaments.find(x=>x.id===form.dataset.form);const max=Number(tournament?.maxTeams)||4;
        const progress=card.querySelector('[data-progress]');if(progress)progress.style.width=Math.min(100,newCount/max*100)+'%';
        if(newCount>=max){const openButton=card.querySelector("[data-open]");if(openButton){openButton.disabled=true;openButton.textContent='Complet';}}
        notice(`Inscription confirmée. Ticket ${result.team.ticketCode} enregistré. Groupe attribué : ${result.team.groupName||'à confirmer'}.`);
      }catch(error){notice(error.message||'Impossible d’enregistrer l’inscription. Les champs saisis sont conservés.');}
      finally{delete form.dataset.submitting;button.disabled=false;button.textContent='Confirmer l’inscription';}
    });
  });
  const applyMatchFilter=(card,filter,group)=>{card.querySelectorAll('[data-match-row]').forEach(row=>{const statusOk=!filter||filter==='all'||row.dataset.matchStatus===filter;const groupOk=!group||row.dataset.matchGroup===group||row.dataset.matchGroup==='Phase éliminatoire';row.style.display=statusOk&&groupOk?'':'none';});card.querySelectorAll('.matchday').forEach(day=>{let next=day.nextElementSibling,visible=false;while(next&&!next.classList.contains('matchday')){if(next.matches('[data-match-row]')&&next.style.display!=='none')visible=true;next=next.nextElementSibling;}day.style.display=visible?'':'none';});}; document.querySelectorAll('[data-match-filter]').forEach(button=>button.addEventListener('click',()=>{const card=button.closest('.card');card.querySelectorAll('[data-match-filter]').forEach(item=>item.classList.toggle('active',item===button));card.querySelectorAll('button[data-match-group]').forEach(item=>item.classList.remove('active'));try{localStorage.setItem('joStadiumClientMatchFilter:'+card.dataset.tournamentCard,button.dataset.matchFilter);localStorage.removeItem('joStadiumClientMatchGroup:'+card.dataset.tournamentCard);}catch(_){}applyMatchFilter(card,button.dataset.matchFilter,'');}));document.querySelectorAll('button[data-match-group]').forEach(button=>{button.addEventListener('click',()=>{const card=button.closest('.card');card.querySelectorAll('button[data-match-group]').forEach(item=>item.classList.toggle('active',item===button));card.querySelectorAll('[data-match-filter]').forEach(item=>item.classList.remove('active'));try{localStorage.setItem('joStadiumClientMatchGroup:'+card.dataset.tournamentCard,button.dataset.matchGroup);localStorage.removeItem('joStadiumClientMatchFilter:'+card.dataset.tournamentCard);}catch(_){}applyMatchFilter(card,'',button.dataset.matchGroup);});});document.querySelectorAll('[data-tournament-card]').forEach(card=>{try{const group=localStorage.getItem('joStadiumClientMatchGroup:'+card.dataset.tournamentCard),filter=localStorage.getItem('joStadiumClientMatchFilter:'+card.dataset.tournamentCard);if(group){const button=[...card.querySelectorAll('button[data-match-group]')].find(b=>b.dataset.matchGroup===group);if(button){button.classList.add('active');applyMatchFilter(card,'',group);}}else if(filter){const button=[...card.querySelectorAll('[data-match-filter]')].find(b=>b.dataset.matchFilter===filter);if(button){button.classList.add('active');applyMatchFilter(card,filter,'');}}}catch(_){}});
}
async function load(force=false){
  // Do not replace the page while someone is filling in a registration form or a draft is present.
  const formIsBeingEdited=[...document.querySelectorAll('[data-form]')].some(form=>form.classList.contains('opened')||[...new FormData(form).values()].some(value=>String(value).trim()!==''));
  if(!force&&formIsBeingEdited)return;
  try{const data=await api('/api/tournaments');tournaments=data.tournaments||[];render();}
  catch(error){if(!$('list').dataset.loaded){$('list').innerHTML='<div class="empty">Impossible de charger les tournois. Réessaie plus tard.</div>';notice(error.message);}}
  $('list').dataset.loaded='1';
}
load(true);
setInterval(()=>{if(document.visibilityState==='visible')load(false);},45000);
</script></body></html>
